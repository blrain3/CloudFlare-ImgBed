name: Upstream Sync

permissions:
  contents: write
  actions: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # 仅用于检出；push 由下一步显式用 SYNC_PAT 完成
          persist-credentials: false

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
        run: |
          set -euo pipefail
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::SYNC_PAT is not configured. GITHUB_TOKEN cannot push workflow files, so the sync is refused rather than silently falling back."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main
          git checkout main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Complete breaking update notices
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Trigger Worker deploy
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "推送使用了 SYNC_PAT。若仍失败，请确认该 PAT 未过期且具备 \`repo\` 与 \`workflow\` 权限；上游改动 workflow 文件时，缺少 \`workflow\` 权限会被拒绝。"
            echo
            echo "The push uses SYNC_PAT. If it still fails, verify the PAT is valid and has both \`repo\` and \`workflow\` scopes; GitHub rejects workflow-file updates without \`workflow\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[Error] 上游同步未能完成；请检查 SYNC_PAT 的 repo/workflow 权限。" >&2
          exit 1
